[package]
name = "evdict"
version = "0.1.0"
edition = "2021"
description = "Tu dien Anh-Viet nhe, tra tu dang chon bang phim tat"

[dependencies]
miniz_oxide = "0.8"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"

[build-dependencies]
embed-manifest = "1.4"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
